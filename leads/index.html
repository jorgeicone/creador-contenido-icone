<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel · Leads · Creador de Contenido ICONE</title>
<meta name="theme-color" content="#050d1f">
<style>
:root{--bg:#050d1f;--surface:rgba(9,22,40,.9);--surface2:#0d1e35;--surface3:#122540;--border:rgba(22,46,74,.8);--border2:#1e3d5e;--accent:#00d4ff;--accent2:#7b2fff;--accent3:#10b981;--gold:#f59e0b;--danger:#ef4444;--text:#e2e8f0;--muted:#7a93b4;--dim:#3d5272}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:26px 18px 70px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#03101f;box-shadow:0 0 24px rgba(0,212,255,.4)}
.brand b{font-weight:800}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#03101f;font-weight:700;border:none;border-radius:10px;padding:11px 18px;cursor:pointer;font-size:14px}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
.btn:hover{filter:brightness(1.08)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:18px}
.gate{max-width:520px;margin:8vh auto 0;text-align:center}
.gate h1{font-size:26px;margin:16px 0 8px}.gate p{color:var(--muted);margin-bottom:18px}
input{width:100%;background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:13px 15px;color:var(--text);font-size:14px;outline:none}
input:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--dim);margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
.kpi b{display:block;font-size:32px;font-weight:800;color:var(--accent)}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.5px}
.tablewrap{overflow-x:auto}
.err{color:var(--danger);font-size:13px;margin-top:10px}
.muted{color:var(--muted)}
.del{background:none;border:1px solid var(--border2);color:var(--danger);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:13px}
.del:hover{background:rgba(239,68,68,.12);border-color:var(--danger)}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="logo">IA</div><div><b>Panel · Leads</b><small>Creador de Contenido a la Medida · ICONE</small></div></div>
    <div id="actions" style="display:none">
      <button class="btn ghost" id="csv">⬇ Exportar CSV</button>
      <button class="btn" id="reload">🔄 Actualizar</button>
    </div>
  </div>

  <div id="gate" class="gate">
    <div class="logo" style="margin:0 auto">IA</div>
    <h1>Acceso al panel</h1>
    <p>Ingresa tu contraseña para ver los leads capturados.</p>
    <input id="secret" type="password" placeholder="Contraseña">
    <button class="btn" style="width:100%;margin-top:14px" id="enter">Entrar →</button>
    <div class="err" id="gerr"></div>
    <p class="hint">Acceso privado. Los leads contienen datos personales y no son públicos.</p>
  </div>

  <div id="dash" style="display:none">
    <div class="kpis" id="kpis"></div>
    <div class="card">
      <h2 style="font-size:16px;margin-bottom:14px">👥 Leads (<span id="cnt">0</span>)</h2>
      <div class="tablewrap"><table><thead><tr>
        <th>#</th><th>Nombre</th><th>Correo</th><th>Negocio</th><th>App</th><th>Fecha</th><th></th>
      </tr></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </div>
</div>
<script>
const SB_URL="https://nvgkhdrrxqdgxktfkioa.supabase.co", SB_PUB="sb_publishable_d1RrtE7S-9a8e8mGKRRjxQ_4HU_nkDl";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
let DATA=[];
$("enter").onclick=()=>load($("secret").value);
$("secret").addEventListener("keydown",e=>{if(e.key==="Enter")load($("secret").value);});
const saved=localStorage.getItem("leads_pw"); if(saved) load(saved);
async function load(pw){
  if(!pw){$("gerr").textContent="Escribe la contraseña.";return;}
  $("gerr").textContent="Entrando…";
  try{
    const r=await fetch(SB_URL+"/rest/v1/rpc/get_leads",{method:"POST",headers:{"apikey":SB_PUB,"Authorization":"Bearer "+SB_PUB,"Content-Type":"application/json"},body:JSON.stringify({pass:pw})});
    if(!r.ok){const t=await r.text();$("gerr").textContent=(t.includes("unauthorized")||r.status===400||r.status===401)?"Contraseña incorrecta.":("Error "+r.status);localStorage.removeItem("leads_pw");return;}
    DATA=await r.json(); localStorage.setItem("leads_pw",pw);
    $("gate").style.display="none";$("dash").style.display="block";$("actions").style.display="flex";
    render();
  }catch(e){$("gerr").textContent="No se pudo conectar: "+e.message;}
}
$("reload").onclick=()=>load(localStorage.getItem("leads_pw")||"");
$("csv").onclick=()=>{
  const head=["nombre","email","negocio","app","fecha"];
  const rows=DATA.map(d=>[d.nombre,d.email,d.negocio,d.app,d.created_at].map(v=>`"${(v??"").toString().replace(/"/g,'""')}"`).join(","));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+[head.join(","),...rows].join("\n")],{type:"text/csv;charset=utf-8"}));a.download="leads-icone.csv";a.click();
};
async function del(id){
  if(!confirm("¿Borrar este lead?"))return;
  const pw=localStorage.getItem("leads_pw")||"";
  const r=await fetch(SB_URL+"/rest/v1/rpc/delete_lead",{method:"POST",headers:{"apikey":SB_PUB,"Authorization":"Bearer "+SB_PUB,"Content-Type":"application/json"},body:JSON.stringify({pass:pw,rid:id})});
  if(!r.ok){alert("No se pudo borrar.");return;} load(pw);
}
window.del=del;
function render(){
  const n=DATA.length;
  const hoy=new Date().toISOString().slice(0,10);
  const deHoy=DATA.filter(d=>(d.created_at||"").slice(0,10)===hoy).length;
  $("kpis").innerHTML=`<div class="kpi"><b>${n}</b><span>Leads totales</span></div><div class="kpi"><b style="color:#10b981">${deHoy}</b><span>Hoy</span></div>`;
  $("cnt").textContent=n;
  $("tbody").innerHTML=DATA.map((d,i)=>{
    const f=d.created_at?new Date(d.created_at).toLocaleString("es-CO",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
    return `<tr><td>${i+1}</td><td><b>${esc(d.nombre||"—")}</b></td><td>${esc(d.email||"—")}</td><td class="muted">${esc(d.negocio||"—")}</td><td class="muted">${esc(d.app||"—")}</td><td class="muted">${f}</td><td><button class="del" onclick="del('${d.id}')">🗑</button></td></tr>`;
  }).join("");
}
</script>
</body>
</html>
